name: Test

on:
  push:
  pull_request:

# Read-only token: nothing here writes to the repo, and the HACS/hassfest
# actions are third-party refs that run with it.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Correctness + HA conventions; ruff-format owns layout. Config and the
      # reasoning for each ignored rule live in pyproject.toml.
      - run: pip install ruff==0.15.19
      - run: ruff check .
      - run: ruff format --check .
